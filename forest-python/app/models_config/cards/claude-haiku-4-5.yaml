name: claude-haiku-4-5
label: Claude Haiku 4.5
provider: anthropic
kind: chat
status: active
description: Anthropic 快速模型（Anthropic 原生端点）
api:
  request_format: anthropic
  response_format: anthropic
  base_url: https://api.anthropic.com/v1
context_size: 200000
output_size: 8192
parameters:
  temperature:
    type: number
    title: 采样温度
    description: 越高回答越随机，越低越确定
    default: 0.7
    minimum: 0
    maximum: 1
  max_tokens:
    type: integer
    title: 最大输出 Token
    description: 单次回答的最大 token 数
    default: 4096
    minimum: 1
    maximum: 8192
