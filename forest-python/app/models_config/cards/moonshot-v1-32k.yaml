name: moonshot-v1-32k
label: Moonshot v1 32K
provider: moonshot
kind: chat
status: active
description: 月之暗面 32K 模型
api:
  request_format: openai
  response_format: openai
  base_url: https://api.moonshot.cn/v1
context_size: 32000
output_size: 4096
parameters:
  temperature:
    type: number
    title: 采样温度
    description: 越高回答越随机，越低越确定
    default: 0.7
    minimum: 0
    maximum: 2
  max_tokens:
    type: integer
    title: 最大输出 Token
    description: 单次回答的最大 token 数
    default: 4096
    minimum: 1
    maximum: 4096
