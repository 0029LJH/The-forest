name: deepseek-chat
label: DeepSeek Chat
provider: deepseek
kind: chat
status: deprecated
description: DeepSeek 旧世代模型（已停售）
api:
  request_format: openai
  response_format: openai
  base_url: https://api.deepseek.com/v1
context_size: 1000000
output_size: 384000
parameters:
  temperature:
    type: number
    title: 采样温度
    description: 越高回答越随机，越低越确定
    default: 0.7
    minimum: 0
    maximum: 2
  max_tokens:
    type: integer
    title: 最大输出 Token
    description: 单次回答的最大 token 数
    default: 4096
    minimum: 1
    maximum: 384000
